# Builds and tests on every push to main and every pull request.
# On a tag v<Version> it also pushes Spkl.OnPrem, Spkl.OnPrem.Attributes and Spkl.OnPrem.Templates
# to GitHub Packages and attaches them to a GitHub release.
# The repository variable SPKL_RUNS_ON selects another Windows runner, e.g. ["self-hosted","windows"]; the default is windows-latest.

name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ fromJSON(vars.SPKL_RUNS_ON || '"windows-latest"') }}
    defaults:
      run:
        working-directory: spkl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build test plugins
        run: |
          dotnet build TestPlugin
          dotnet build TestWorkflowActivity
          dotnet build TestPluginWorkflowCombined
      - name: Build CLI
        run: dotnet build spkl -c Release
      - name: Unit tests
        run: dotnet test SparkleXrm.Tasks.Tests --filter "TestCategory=Unit Tests"
      - name: Pack
        run: ..\build\Pack.ps1 -OutputDirectory "$env:RUNNER_TEMP\packages"
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: ${{ runner.temp }}/packages/*.nupkg
          if-no-files-found: error
          retention-days: 7
      - name: Build a solution created from the template
        working-directory: ${{ runner.temp }}
        run: |
          dotnet new install (Get-ChildItem "$env:RUNNER_TEMP\packages\Spkl.OnPrem.Templates.*.nupkg" | Select-Object -First 1).FullName
          dotnet new spkl-solution -n Fabrikam -o Fabrikam --SolutionUniqueName ContosoCore --FeedUrl "$env:RUNNER_TEMP\packages" --allow-scripts no
          cd Fabrikam
          pwsh -NoProfile -File Tooling\New-SigningKey.ps1
          if (Select-String -Path Tooling\spkl.json -Pattern '<SolutionUniqueName>' -SimpleMatch) { throw 'SolutionUniqueName was not replaced' }
          if (Select-String -Path nuget.config -Pattern '__FeedUrl__' -SimpleMatch) { throw 'FeedUrl was not replaced' }
          dotnet build Fabrikam.sln
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $packages = if ($env:NUGET_PACKAGES) { $env:NUGET_PACKAGES } else { Join-Path $env:USERPROFILE '.nuget\packages' }
          $spkl = Get-ChildItem (Join-Path $packages 'spkl.onprem') -Recurse -Filter spkl.exe | Select-Object -First 1
          if (-not $spkl) { throw 'spkl.exe was not restored by the Tooling project' }
          if (-not (Test-Path (Join-Path $spkl.DirectoryName 'spkl.CrmSvcUtilExtensions.dll'))) { throw 'spkl.CrmSvcUtilExtensions.dll is missing next to spkl.exe' }
          foreach ($assembly in 'Plugins\bin\Debug\Fabrikam.Plugins.dll', 'Actions\bin\Debug\Fabrikam.Actions.dll', 'Workflows\bin\Debug\Fabrikam.Workflows.dll') {
            $token = [System.Reflection.AssemblyName]::GetAssemblyName((Resolve-Path $assembly)).GetPublicKeyToken()
            if (-not $token -or $token.Length -eq 0) { throw "$assembly is not strong-named" }
            if (-not [System.Reflection.Assembly]::LoadFile((Resolve-Path $assembly).Path).GetType('CrmPluginRegistrationAttribute')) { throw "$assembly does not contain CrmPluginRegistrationAttribute" }
          }
      - name: Add the Tooling to an existing solution
        working-directory: ${{ runner.temp }}
        run: |
          New-Item -ItemType Directory Existing | Out-Null
          cd Existing
          dotnet new sln -n Existing
          $sln = (Get-ChildItem 'Existing.sln*' | Select-Object -First 1).Name
          dotnet new classlib -n Existing.Plugins -o Plugins -f netstandard2.0
          dotnet sln add Plugins\Existing.Plugins.csproj
          dotnet new spkl-tooling --SolutionUniqueName ContosoCore --FeedUrl "$env:RUNNER_TEMP\packages"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($file in 'Tooling\Tooling.csproj', 'Tooling\spkl.json', 'Tooling\spkl.ps1', '.vscode\tasks.json', 'nuget.config') {
            if (-not (Test-Path $file)) { throw "$file was not created" }
          }
          if (Test-Path 'Directory.Build.props') { throw 'spkl-tooling must not add Directory.Build.props' }
          if (Select-String -Path Tooling\spkl.json -Pattern '<SolutionUniqueName>' -SimpleMatch) { throw 'SolutionUniqueName was not replaced' }
          if (Select-String -Path nuget.config -Pattern '__FeedUrl__' -SimpleMatch) { throw 'FeedUrl was not replaced' }
          if (-not (dotnet sln list | Select-String 'Tooling.csproj' -SimpleMatch)) { throw 'Tooling was not added to the solution' }
          dotnet build $sln
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cd ..
          New-Item -ItemType Directory NoExtras | Out-Null
          cd NoExtras
          dotnet new spkl-tooling --SolutionUniqueName ContosoCore --FeedUrl "$env:RUNNER_TEMP\packages" --NuGetConfig false --VsCodeTasks false
          if (Test-Path 'nuget.config') { throw 'nuget.config created despite --NuGetConfig false' }
          if (Test-Path '.vscode') { throw '.vscode created despite --VsCodeTasks false' }

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ fromJSON(vars.SPKL_RUNS_ON || '"windows-latest"') }}
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: ${{ runner.temp }}/packages
      - name: Check tag against version
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match Version $version in Directory.Build.props" }
      - name: Push to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $feed = "https://nuget.pkg.github.com/$env:GITHUB_REPOSITORY_OWNER/index.json"
          foreach ($package in Get-ChildItem "$env:RUNNER_TEMP\packages" -Filter *.nupkg) {
            dotnet nuget push $package.FullName --source $feed --api-key $env:GITHUB_TOKEN --skip-duplicate
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Attach to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $packages = (Get-ChildItem "$env:RUNNER_TEMP\packages" -Filter *.nupkg).FullName
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME @packages --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME @packages --title $env:GITHUB_REF_NAME --generate-notes --verify-tag
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
